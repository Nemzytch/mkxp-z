# Windows build (MSYS2), based on the windows/Makefile + meson recipe.
name: Windows

on:
  push:
    branches: ['if-mp']
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          install: >-
            base-devel
            git
            ruby
            vim
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-autotools
            mingw-w64-x86_64-gcc

      - name: Checkout repository
        uses: actions/checkout@v4

      # Keep built dependencies between runs, even on failure
      # (make resumes where it stopped)
      - uses: actions/cache/restore@v4
        with:
          path: |
            windows/build-mingw64
            windows/downloads
          key: win-${{ hashFiles('windows/Makefile') }}-${{ github.run_id }}
          restore-keys: win-

      - name: Build all dependencies
        shell: msys2 {0}
        run: |
          cd windows
          # Ruby not built yet: start again from clean sources
          [ -f build-mingw64/bin/x64-msvcrt-ruby310.dll ] || rm -rf downloads/mingw64/ruby
          make

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            windows/build-mingw64
            windows/downloads
          key: win-${{ hashFiles('windows/Makefile') }}-${{ github.run_id }}

      - name: Build exe
        shell: msys2 {0}
        run: |
          source windows/vars.sh
          meson setup build -Dcpp_args="-include cstdint"
          cd build
          ninja
          strip ./mkxp-z.exe

      - name: Prepare archive
        shell: msys2 {0}
        run: |
          mkdir build/artifact
          cd build/artifact
          cp /mingw64/bin/zlib1.dll .
          cp ../../windows/build-mingw64/bin/x64-msvcrt-ruby310.dll .
          cp -r ../../windows/build-mingw64/lib/ruby/3.1.0 ./stdlib
          cp ../mkxp-z.exe .
          cp ../../mkxp.json .

      - uses: actions/upload-artifact@v4
        with:
          name: mkxp-z-if-mp.windows-${{ github.sha }}
          path: build/artifact/
